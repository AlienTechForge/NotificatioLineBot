name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # GHCR 會自動轉小寫

concurrency:
  # 同一分支的新推送取消舊的 CI，但「部署」不可中途取消 —— 見 deploy job
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #  測試
  #
  #  跑在 GitHub-hosted runner：整合測試用 Testcontainers 自備 PostgreSQL，
  #  不需要 server 上的任何東西。讓 PR 完全不接觸正式環境。
  # ═══════════════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify 會跑：
      #   surefire  -> *Test  單元測試
      #   failsafe  -> *IT    整合測試（Testcontainers 起真的 PostgreSQL）
      #   jacoco    -> 覆蓋率門檻（整體 80% / auth 95%），不達標直接失敗
      - name: Maven verify
        run: mvn -B -ntp -f server/pom.xml verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════
  #  建置並推送 image 到 GHCR
  # ═══════════════════════════════════════════════════════════════════
  image:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile 不在根目錄；context 必須是根目錄，因為它要 COPY server/ 與 admin-ui/
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ADMIN_UI=false
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # 用 sha tag 而非 latest 部署：每次部署可追溯，回滾只要換 tag
      - name: Compute image ref
        id: ref
        run: |
          repo=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${{ env.REGISTRY }}/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════
  #  部署到 server
  #
  #  跑在組織層級的 self-hosted runner（alien-server）上 ——
  #  它「就在」那台 server，所以不需要 SSH 金鑰、不需要對外開 22 port，
  #  也不需要把任何憑證放進 GitHub Secrets。
  #
  #  前提：repo 必須在 AlienTechForge 組織下（org 層級的 runner 只服務組織內的 repo）。
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64]
    needs: image
    if: github.ref == 'refs/heads/main'
    # 部署不可中途被取消 —— 取消到一半比讓它跑完更危險
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      # 留空時在下方步驟解析為 $HOME/notifyline（runner 使用者一定寫得進去）
      DEPLOY_PATH_OVERRIDE: ${{ vars.DEPLOY_PATH }}
      IMAGE_REF: ${{ needs.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      # 部署目錄放在 runner 使用者的家目錄下。
      #
      # 不用 /opt/notifyline —— runner 以 github-actions 身分執行且沒有
      # passwordless sudo，動不了 /opt。硬要用就得人工先建一次目錄，
      # 那正是這裡想避免的。家目錄一定寫得進去，且權限天然隔離。
      - name: 準備部署目錄
        run: |
          set -euo pipefail
          TARGET="${DEPLOY_PATH_OVERRIDE:-$HOME/notifyline}"
          mkdir -p "$TARGET"
          echo "DEPLOY_PATH=$TARGET" >> "$GITHUB_ENV"
          echo "部署目錄：$TARGET（使用者 $(id -un)）"

      - name: 檢查 docker 權限
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "::error::runner 使用者 $(id -un) 不能使用 docker。在 server 上執行："
            echo "::error::  sudo usermod -aG docker $(id -un) && sudo systemctl restart actions.runner.*"
            exit 1
          fi
          echo "docker 可用"

      # .env 由 CI 從 GitHub Secrets 產生 —— 單一真相來源，
      # 輪替機密只要改 Secret 再重跑一次部署，不必登入 server。
      #
      # 取捨：機密因此存在 GitHub Secrets（加密儲存，只在本組織的 private repo
      # 的 workflow 執行時解密）。若要改回「.env 只在 server 上、CI 完全碰不到」，
      # 把這個 step 換成「檢查 .env 是否存在」即可。
      - name: 產生 .env
        run: |
          set -euo pipefail
          umask 077
          cat > "$DEPLOY_PATH/.env" <<'ENVEOF'
          LINE_CHANNEL_TOKEN=${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_CHANNEL_SECRET=${{ secrets.LINE_CHANNEL_SECRET }}
          APP_SECRET_ENC_KEY=${{ secrets.APP_SECRET_ENC_KEY }}
          APP_SECRET_ENC_KEY_VERSION=${{ vars.APP_SECRET_ENC_KEY_VERSION || '1' }}
          APP_SECRET_ENC_KEY_V2=${{ secrets.APP_SECRET_ENC_KEY_V2 }}
          APP_PUBLIC_BASE_URL=${{ vars.APP_PUBLIC_BASE_URL }}
          APP_OWNER_LINE_USER_ID=${{ vars.APP_OWNER_LINE_USER_ID }}
          APP_ALLOWED_URI_HOSTS=${{ vars.APP_ALLOWED_URI_HOSTS }}
          APP_ADMIN_USERNAME=${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }}
          DB_URL=jdbc:postgresql://postgres:5432/notifyline
          DB_USER=${{ vars.DB_USER || 'notifyline' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          APP_PORT=${{ vars.APP_PORT || '19080' }}
          SPRING_PROFILES_ACTIVE=prod
          ENVEOF
          # heredoc 內的縮排要去掉（用 <<'EOF' 不能用 <<-，這裡自己處理）
          sed -i 's/^          //' "$DEPLOY_PATH/.env"
          chmod 600 "$DEPLOY_PATH/.env"

          # 管理介面只要有一半設定就是錯的：有帳號沒密碼會讓應用啟動失敗，
          # 有密碼沒帳號會讓整個管理介面靜悄悄地不存在。與其之後查半天，
          # 不如在這裡就擋下來。
          admin_user=$(grep -E '^APP_ADMIN_USERNAME=' "$DEPLOY_PATH/.env" | cut -d= -f2-)
          admin_pass=$(grep -E '^APP_ADMIN_PASSWORD=' "$DEPLOY_PATH/.env" | cut -d= -f2-)
          if [ -n "$admin_user$admin_pass" ] && { [ -z "$admin_user" ] || [ -z "$admin_pass" ]; }; then
            echo "::error::APP_ADMIN_USERNAME 與 APP_ADMIN_PASSWORD 必須同時設定或同時留空"
            exit 1
          fi
          if [ -n "$admin_pass" ] && [ "${#admin_pass}" -lt 12 ]; then
            echo "::error::APP_ADMIN_PASSWORD 至少要 12 個字元"
            exit 1
          fi
          if [ -z "$admin_user" ]; then
            echo "::notice::未設定 APP_ADMIN_USERNAME，管理介面停用"
          fi

          # 不輸出值，只確認關鍵欄位有內容
          for k in LINE_CHANNEL_TOKEN LINE_CHANNEL_SECRET APP_SECRET_ENC_KEY DB_PASSWORD; do
            v=$(grep -E "^${k}=" "$DEPLOY_PATH/.env" | cut -d= -f2-)
            [ -n "$v" ] || { echo "::error::$k 是空的，檢查 GitHub Secrets"; exit 1; }
            echo "  $k: 已設定（${#v} 字元）"
          done

          # 加密金鑰長度錯的話應用會拒絕啟動，先在這裡擋下
          klen=$(grep -E '^APP_SECRET_ENC_KEY=' "$DEPLOY_PATH/.env" | cut -d= -f2- | base64 -d 2>/dev/null | wc -c)
          [ "$klen" = "32" ] || { echo "::error::APP_SECRET_ENC_KEY 解碼後 ${klen} bytes，必須是 32"; exit 1; }
          echo "  APP_SECRET_ENC_KEY 長度正確（32 bytes）"

      - name: 更新 compose 檔
        run: cp docker/docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.yml"

      - name: 拉取並啟動
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # 記下目前版本供回滾
          PREV=$(docker inspect --format='{{.Config.Image}}' notifyline-app 2>/dev/null || echo "")
          echo "目前版本: ${PREV:-（無）}"
          echo "目標版本: $IMAGE_REF"
          echo "PREV_IMAGE=$PREV" >> "$GITHUB_ENV"

          # private package 需要登入。GITHUB_TOKEN 是短效的，用完就登出。
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          export NOTIFYLINE_IMAGE="$IMAGE_REF"
          docker compose --env-file .env pull app
          docker compose --env-file .env up -d

      - name: 健康檢查
        id: health
        run: |
          set -uo pipefail
          cd "$DEPLOY_PATH"
          APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d ' \r' || true)
          APP_PORT="${APP_PORT:-19080}"

          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/actuator/health" | grep -q '"status":"UP"'; then
              echo "健康檢查通過（$((i * 2)) 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::180 秒內未通過健康檢查"
          docker compose --env-file .env logs --tail=60 app || true
          exit 1

      - name: 回滾
        if: failure() && steps.health.outcome == 'failure' && env.PREV_IMAGE != ''
        run: |
          cd "$DEPLOY_PATH"
          export NOTIFYLINE_IMAGE="$PREV_IMAGE"
          docker compose --env-file .env up -d
          echo "::warning::已回滾到 $PREV_IMAGE"

      - name: 登出 GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Summary
        if: success()
        run: |
          cd "$DEPLOY_PATH"
          APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d ' \r' || echo 19080)
          {
            echo "### 部署成功"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_REF\` |"
            echo "| 部署路徑 | \`$DEPLOY_PATH\` |"
            echo "| 本機健康檢查 | \`http://127.0.0.1:$APP_PORT/actuator/health\` |"
            echo "| 對外 | https://notify.example.com/actuator/health |"
          } >> "$GITHUB_STEP_SUMMARY"
