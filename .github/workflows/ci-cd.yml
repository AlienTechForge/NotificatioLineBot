name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # GHCR 會自動轉小寫

concurrency:
  # 同一分支的新推送取消舊的 CI，但「部署」不可中途取消 —— 見 deploy job
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #  測試
  #
  #  跑在 GitHub-hosted runner：整合測試用 Testcontainers 自備 PostgreSQL，
  #  不需要 server 上的任何東西。讓 PR 完全不接觸正式環境。
  # ═══════════════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify 會跑：
      #   surefire  -> *Test  單元測試
      #   failsafe  -> *IT    整合測試（Testcontainers 起真的 PostgreSQL）
      #   jacoco    -> 覆蓋率門檻（整體 80% / auth 95%），不達標直接失敗
      - name: Maven verify
        run: mvn -B -ntp -f server/pom.xml verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════
  #  建置並推送 image 到 GHCR
  # ═══════════════════════════════════════════════════════════════════
  image:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Dockerfile 不在根目錄；context 必須是根目錄，因為它要 COPY server/ 與 admin-ui/
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ADMIN_UI=false
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # 用 sha tag 而非 latest 部署：每次部署可追溯，回滾只要換 tag
      - name: Compute image ref
        id: ref
        run: |
          repo=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${{ env.REGISTRY }}/${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════
  #  部署到 server
  #
  #  未設定 SSH secrets 時自動跳過（不會讓整個 workflow 紅燈）。
  #  需要的 secrets：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
  #  選用 variable：DEPLOY_PORT（非 22 時）、DEPLOY_PATH（預設 /opt/notifyline）
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main'
    # 部署不可中途被取消 —— 取消到一半比讓它跑完更危險
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/notifyline' }}
      IMAGE_REF: ${{ needs.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            {
              echo "### 部署已跳過"
              echo ""
              echo "缺少 SSH secrets。image 已推上 GHCR："
              echo ""
              echo '```'
              echo "$IMAGE_REF"
              echo '```'
              echo ""
              echo "要啟用自動部署，設定 \`DEPLOY_HOST\` / \`DEPLOY_USER\` / \`DEPLOY_SSH_KEY\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload compose file
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" \
            docker/docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            IMAGE_REF="$IMAGE_REF" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_USER="${{ github.actor }}" \
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            'bash -seu' <<'REMOTE'
            cd "$DEPLOY_PATH"

            # .env 由 server 端管理，不經 CI —— 機密不落在 runner 上
            [ -f .env ] || { echo "::error::$DEPLOY_PATH/.env 不存在，請先在 server 上建立"; exit 1; }

            # 記下目前版本供回滾
            PREV=$(docker inspect --format='{{.Config.Image}}' notifyline-app 2>/dev/null || echo "")
            echo "目前版本: ${PREV:-（無）}"
            echo "目標版本: $IMAGE_REF"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export NOTIFYLINE_IMAGE="$IMAGE_REF"
            docker compose --env-file .env pull app
            docker compose --env-file .env up -d

            # 讀 APP_PORT 做健康檢查
            APP_PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 | tr -d ' \r' || true)
            APP_PORT="${APP_PORT:-19080}"

            echo "等待健康檢查（最多 180 秒）..."
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/actuator/health" | grep -q '"status":"UP"'; then
                echo "健康檢查通過（$((i * 2)) 秒）"
                docker logout ghcr.io >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 2
            done

            echo "::error::健康檢查失敗，回滾中"
            docker compose --env-file .env logs --tail=60 app || true
            if [ -n "$PREV" ]; then
              export NOTIFYLINE_IMAGE="$PREV"
              docker compose --env-file .env up -d
              echo "已回滾到 $PREV"
            fi
            docker logout ghcr.io >/dev/null 2>&1 || true
            exit 1
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Summary
        if: steps.gate.outputs.ok == 'true' && success()
        run: |
          {
            echo "### 部署成功"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_REF\` |"
            echo "| Host | \`$DEPLOY_HOST\` |"
            echo "| Path | \`$DEPLOY_PATH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
