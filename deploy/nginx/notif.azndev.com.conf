# =====================================================================
#  notif.azndev.com — 統一 LINE Notification Service
#
#  放到：/etc/nginx/conf.d/notif.azndev.com.conf
#       （或你現有的 sites-available + symlink 慣例）
#
#  上游是 docker-compose 起的 app，只綁 127.0.0.1:${APP_PORT}。
#  預設 19080 —— 8080 已被占用。若要換 port，改這裡的 upstream 與 .env 的
#  APP_PORT，兩邊要一致。
# =====================================================================

# 管理介面的登入嘗試速率限制。
#
# 應用層「沒有」登入失敗鎖定 —— 見 ADR-0011 的負面後果。管理介面對公開網際網路
# 開放，所以這道防線在 nginx 做。5 r/m 對真人綽綽有餘，對暴力破解則不夠用。
#
# binary_remote_addr 而非 remote_addr：前者省記憶體，10m 約可追蹤 16 萬個位址。
limit_req_zone $binary_remote_addr zone=notifyline_admin_login:10m rate=5r/m;

upstream notifyline {
    # 與 .env 的 APP_PORT 一致
    server 127.0.0.1:19080;
    keepalive 16;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name notif.azndev.com;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notif.azndev.com;

    ssl_certificate     /etc/nginx/ssl/*.azndev.com_azndev.com_P256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.azndev.com_azndev.com_P256/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 這是純 JSON API，body 很小。
    # 應用層本身就把 request body 上限設在 64KB（超過回 413），
    # 這裡設 1M 只是提早擋掉明顯異常的請求，不用跟 MinIO 一樣開到 10G。
    client_max_body_size 1m;

    # 通知服務的請求都是短的；不需要 MinIO 那種 300s 超時。
    # 但要比 LINE 的 webhook 逾時寬鬆一點，避免我們這邊還在處理就被 nginx 切掉。
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ModSecurity 對 JSON POST 常有誤判，會讓 LINE 的 webhook 被擋在門外。
    modsecurity off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 網站掛在 Cloudflare 橘雲後面，要先把 $remote_addr 從「Cloudflare 節點 IP」
    # 還原成真實訪客 IP，/admin/ 的 IP 白名單才有意義。見 snippet 內的說明。
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # ⚠️ 絕對不要開 proxy_intercept_errors 或 include 自訂錯誤頁。
    #
    # 這個 API 的 4xx 回應「本身就是契約的一部分」——
    # 呼叫端要靠 body 裡的 {"error":{"code":"AUTH_NONCE_REPLAY",...}} 分支處理。
    # 換成 nginx 的 HTML 錯誤頁，對方只會看到一坨看不懂的東西。
    #
    # 同理，LINE webhook 驗簽失敗時我們回 4xx 是正常行為，不是「壞掉」。
    # proxy_intercept_errors on;                      ← 不要
    # include /etc/nginx/snippets/error-pages.conf;   ← 不要

    # ── LINE Webhook ─────────────────────────────────────────────────
    # 單獨拉出來是為了獨立的存取日誌 —— webhook 出問題時最需要查的就是它。
    location = /line/webhook {
        modsecurity off;

        proxy_pass http://notifyline;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 驗簽是對「原始 body bytes」做 HMAC。任何改動 body 的行為都會讓
        # 簽章對不上，而錯誤訊息只會是一句「Invalid API signature」。
        # 這裡不做任何 body 轉換，也不要在此開 gzip/sub_filter 之類的模組。
        proxy_request_buffering off;
        proxy_buffering off;

        access_log /var/log/nginx/notif.azndev.com.webhook.log;
    }

    # ── 通知 API ─────────────────────────────────────────────────────
    location /api/ {
        modsecurity off;

        proxy_pass http://notifyline;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同上：HMAC 簽章對 body bytes 敏感，不做任何轉換。
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ── 金鑰領取的一次性連結（T6）─────────────────────────────────
    location /enroll/ {
        modsecurity off;

        proxy_pass http://notifyline;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 這個頁面會顯示 client secret，且只顯示一次。
        # 應用層已經送了 no-store，這裡再保險一次，確保任何中間層都不留副本。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── 健康檢查 ─────────────────────────────────────────────────────
    # 只放行 health，不放行整個 /actuator ——
    # /actuator/env、/actuator/configprops 之類會洩漏設定值。
    # 用前綴比對而非 `location =`，才涵蓋 /actuator/health/liveness
    # 與 /actuator/health/readiness 這兩個子路徑。
    location /actuator/health {
        proxy_pass http://notifyline;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # ── 管理介面（ADR-0011）────────────────────────────────────────
    #
    # ⚠️ 這個路徑能改變所有通知的流向。開放前先確認：
    #     1. APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD 兩個 Secret 都設了
    #        （沒設的話應用根本不註冊這條路徑，這裡會回 404）
    #     2. 密碼夠強 —— 應用層要求至少 12 字元，但那只是下限
    #
    # 已用 IP 白名單鎖到單一來源（見下方的 allow/deny）。這是比密碼強度更有效的
    # 一道防線 —— 不在名單上的人連登入頁都碰不到。
    #
    # 沒有結尾斜線的 /admin 不會被下面的 `location /admin/` 前綴比對命中，
    # 會落到最後的 `return 404`。手打網址時少一個斜線就進不去，
    # 而 404 完全看不出原因。
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        # 只允許這個來源。所有存取（含內網）都經 notif.azndev.com 出去再進來，
        # 所以來源永遠是 server 自己的出口 IP。這道 IP 白名單比密碼強度更有效 ——
        # 不在名單上的人連登入頁都碰不到，暴力破解無從開始。
        #
        # 這裡比對的是「還原後」的真實 IP（見上方的 cloudflare-real-ip include）——
        # 少了那個 include，這裡會拿 Cloudflare 節點 IP 去比，結果是全部 403。
        #
        # 換 ISP 或出口 IP 變動時，這行要跟著改，否則自己也會被擋在外面。
        allow 1.34.157.188;
        deny  all;

        modsecurity off;

        proxy_pass http://notifyline;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 後台頁面不該被快取或被嵌進別人的網頁
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 登入端點單獨限速。
    #
    # 必須放在 /admin/ 之後 —— nginx 的 `location =` 精確比對優先於前綴比對，
    # 所以順序其實不影響匹配，但寫在一起比較容易看出兩者的關係。
    #
    # burst=3 允許打錯幾次密碼；nodelay 讓那幾次立刻處理而不是排隊。
    location = /admin/login {
        allow 1.34.157.188;
        deny  all;

        limit_req zone=notifyline_admin_login burst=3 nodelay;
        limit_req_status 429;

        modsecurity off;

        proxy_pass http://notifyline;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;

        access_log /var/log/nginx/notif.azndev.com.adminlogin.log;
    }

    # ── 其餘一律拒絕 ─────────────────────────────────────────────────
    # 預設拒絕而非預設放行：日後應用新增端點時，要先在這裡明確開放，
    # 不會有人不小心把管理介面暴露出去。
    location / {
        return 404;
    }

    access_log /var/log/nginx/notif.azndev.com.access.log;
    error_log  /var/log/nginx/notif.azndev.com.error.log;
}
