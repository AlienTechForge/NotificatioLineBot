# 自動化測試 profile。
#
# 資料庫由 Testcontainers 透過 @ServiceConnection 注入，這裡不設 datasource。
# LINE 憑證一律是假值 —— 測試絕不呼叫真實 LINE API（見 08-測試計畫 §7）。
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  datasource:
    hikari:
      # 每個不同的 @DynamicPropertySource / bean 覆寫組合，Spring Test 都會快取成獨立的
      # ApplicationContext，各自持有一個 Hikari pool，且直到 JVM 結束都不會關閉。
      # IT 測試類別數量成長後，全部 pool 疊加很容易超過 Postgres 測試容器的
      # max_connections 預設值（"FATAL: sorry, too many clients already"）。
      # 這裡沒有任何一個測試需要超過 2 個併發連線（見 ApiMonitorStoreIT 的併發 claim 測試），
      # 縮小上限只影響資源占用，不影響測試語意。
      maximum-pool-size: 4
      minimum-idle: 1

line:
  bot:
    channel-token: test-channel-token
    channel-secret: test-channel-secret
    handler:
      path: /line/webhook

app:
  public-base-url: https://test.example.com
  owner-line-user-id: ""
  allowed-uri-hosts: example.com
  crypto:
    current-key-version: 1
    # 測試專用固定 key（32 bytes base64）。只能出現在測試設定。
    keys:
      "1": dGVzdC1vbmx5LWtleS1ETy1OT1QtVVNFLUlOLVBST0Q=

logging:
  level:
    root: WARN
    com.jason.notifyline: INFO
    org.flywaydb: WARN
